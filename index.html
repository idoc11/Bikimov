<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>НЕОН ШТОРМ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060d;color:#e8f4ff;font-family:"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:16px;background:radial-gradient(ellipse at center,rgba(8,10,28,.72),rgba(2,3,10,.93));text-align:center;z-index:5;overflow-y:auto;touch-action:pan-y}
.ov.on{display:flex}
h1{font-size:clamp(36px,8vw,72px);letter-spacing:.08em;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 12px #3df2ff,0 0 40px #3df2ff,0 0 80px #ff3d9a}
h1 span{color:#ff3d9a;text-shadow:0 0 12px #ff3d9a,0 0 50px #ff3d9a}
h2{font-size:clamp(26px,5vw,44px);letter-spacing:.1em;text-shadow:0 0 18px #3df2ff}
h3{font:800 12px inherit;letter-spacing:.25em;color:#5d79a8;margin-top:4px}
p{color:#9db4d6;font-size:14px;line-height:1.6;max-width:560px}
kbd{display:inline-block;padding:1px 8px;border:1px solid #3d5a85;border-radius:5px;background:#0d1530;color:#dff;font:600 13px monospace}
button{font:800 20px inherit;letter-spacing:.15em;color:#04121a;background:#3df2ff;border:0;border-radius:10px;padding:13px 44px;cursor:pointer;box-shadow:0 0 24px #3df2ff,0 0 60px rgba(61,242,255,.45);transition:transform .12s,box-shadow .12s}
button:hover{transform:scale(1.06);box-shadow:0 0 34px #3df2ff,0 0 90px rgba(61,242,255,.7)}
button.ghost{background:transparent;color:#9db4d6;border:2px solid #2b3f6b;box-shadow:none;font-size:15px;padding:9px 28px}
button.ghost:hover{border-color:#3df2ff;color:#fff;box-shadow:none}
.row,.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cards{gap:14px}
.card,.chip{border:2px solid #2b3f6b;border-radius:14px;background:linear-gradient(160deg,#101a3a,#0a0f24);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.card{width:200px;padding:20px 14px}
.card:hover,.chip:hover{transform:translateY(-4px);border-color:#3df2ff;box-shadow:0 0 30px rgba(61,242,255,.5)}
.card .ic{font-size:44px}
.card .nm{font-weight:800;font-size:17px;margin:8px 0 6px;color:#fff}
.card .ds{font-size:13px;color:#9db4d6;min-height:36px}
.card .lv{margin-top:8px;font:700 12px monospace;color:#ffd23d}
.card .ky{float:left;margin:-10px 0 0 -4px;font:700 12px monospace;color:#5d79a8}
.chip{width:158px;padding:9px 8px;border-radius:11px}
.chip .ic{font-size:22px;line-height:1}
.chip .nm{font-weight:800;font-size:14px;color:#fff;margin-top:2px}
.chip .ds{font-size:11.5px;color:#9db4d6;line-height:1.35}
.chip .lv{font:700 11px monospace;color:#ffd23d;margin-top:3px}
.chip.sel{border-color:#3df2ff;box-shadow:0 0 22px rgba(61,242,255,.55)}
.chip.off{opacity:.45;cursor:default}
.chip.off:hover{transform:none;border-color:#2b3f6b;box-shadow:none}
#coins{color:#ffd23d;font-weight:800;font-size:16px}
.stats{font-size:17px;line-height:1.75;color:#cfe3ff}
.stats b{color:#ffd23d}
.best{color:#3dffb0;font-weight:700}
@media(max-width:700px){.card{width:44%;padding:12px 8px}.card .ic{font-size:30px}.chip{width:46%}p.keys{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov on" id="menu">
  <h1>НЕОН <span>ШТОРМ</span></h1>
  <p class="keys"><kbd>WASD</kbd> движение &nbsp; <kbd>Мышь</kbd> прицел (огонь сам) &nbsp; <kbd>Пробел</kbd> рывок<br><kbd>Q</kbd> ударная волна &nbsp; <kbd>P</kbd> пауза &nbsp; <kbd>M</kbd> звук</p>
  <p id="touchHint" style="display:none">Слева — стик движения. Тап справа — рывок. Кнопка в углу — ударная волна. Прицел автоматический.</p>
  <h3>КОРАБЛЬ</h3>
  <div class="row" id="ships"></div>
  <h3>АНГАР · ПОСТОЯННЫЕ УЛУЧШЕНИЯ</h3>
  <div class="row" id="shop"></div>
  <p id="coins"></p>
  <button id="play">ИГРАТЬ</button>
  <p class="best" id="menuBest"></p>
</div>

<div class="ov" id="lvl">
  <h2>НОВЫЙ УРОВЕНЬ</h2>
  <p>Выбери улучшение</p>
  <div class="cards" id="cards"></div>
</div>

<div class="ov" id="pause">
  <h2>ПАУЗА</h2>
  <button id="resume">ДАЛЬШЕ</button>
  <button class="ghost" id="quit">В АНГАР</button>
</div>

<div class="ov" id="over">
  <h2 style="color:#ff3d7f;text-shadow:0 0 18px #ff3d7f">ТЕБЯ СМЕЛИ</h2>
  <div class="stats" id="stats"></div>
  <button id="again">ЕЩЁ РАЗ</button>
  <button class="ghost" id="hangar">В АНГАР</button>
</div>

<script>
'use strict';
const C = document.getElementById('c'), g = C.getContext('2d');
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  C.width = W * DPR; C.height = H * DPR;
}
addEventListener('resize', resize); resize();

/* ---------- звук ---------- */
let ac = null, muted = false, lastShot = 0;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function sfx(f, d, type = 'square', v = .05, slide = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), ga = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  ga.gain.setValueAtTime(v, t); ga.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(ga).connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
const S = {
  shot() { const n = performance.now(); if (n - lastShot > 70) { lastShot = n; sfx(rnd(620, 700), .07, 'square', .018, -350); } },
  hit() { sfx(rnd(180, 240), .05, 'triangle', .04, -80); },
  kill() { sfx(rnd(300, 420), .14, 'sawtooth', .035, -260); },
  gem() { sfx(rnd(900, 1300), .06, 'sine', .03, 400); },
  hurt() { sfx(140, .3, 'sawtooth', .09, -100); },
  dash() { sfx(300, .18, 'sine', .07, 700); },
  lvl() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx(f, .18, 'triangle', .06), i * 70)); },
  pw() { [660, 880, 1320].forEach((f, i) => setTimeout(() => sfx(f, .12, 'square', .04), i * 50)); },
  boss() { sfx(70, .9, 'sawtooth', .1, -30); },
  boom() { sfx(90, .5, 'sawtooth', .1, -55); },
  zap() { sfx(rnd(1400, 1900), .06, 'sawtooth', .015, -1000); },
  over() { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => sfx(f, .3, 'triangle', .07), i * 160)); }
};

/* ---------- спрайты свечения ---------- */
const glowCache = {};
function glow(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, color); gr.addColorStop(.25, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.globalAlpha = .55; x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return glowCache[color] = c;
}
function drawGlow(x, y, r, color, a = 1) { g.globalAlpha = a; g.drawImage(glow(color), x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; }
function poly(x, y, r, n, rot) {
  g.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + i * TAU / n; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.closePath();
}

/* ---------- данные ---------- */
const TYPES = {
  grunt:    { r: 12, hp: 16,  sp: 95,  dmg: 10, col: '#ff3d7f', n: 3, xp: 1 },
  runner:   { r: 9,  hp: 10,  sp: 195, dmg: 8,  col: '#ffd23d', n: 3, xp: 1 },
  tank:     { r: 22, hp: 130, sp: 55,  dmg: 20, col: '#b46bff', n: 6, xp: 5 },
  shooter:  { r: 13, hp: 32,  sp: 75,  dmg: 10, col: '#3dffb0', n: 4, xp: 3 },
  splitter: { r: 17, hp: 55,  sp: 85,  dmg: 12, col: '#ff8a3d', n: 5, xp: 3 },
  mini:     { r: 7,  hp: 8,   sp: 175, dmg: 6,  col: '#ff8a3d', n: 5, xp: 1 },
  bomber:   { r: 11, hp: 14,  sp: 150, dmg: 11, col: '#ff5a2d', n: 4, xp: 2 },
  boss:     { r: 46, hp: 1000, sp: 62, dmg: 30, col: '#ff2d2d', n: 8, xp: 0 }
};
const UPS = [
  { id: 'dmg',    ic: '💥', n: 'Урон',              d: '+25% к урону пуль',                 f: p => p.dmg *= 1.25 },
  { id: 'rate',   ic: '⚡', n: 'Скорострельность',  d: '+20% к темпу огня',                 f: p => p.rate *= 1.2 },
  { id: 'multi',  ic: '🔱', n: 'Мультивыстрел',     d: '+1 снаряд за залп',        max: 5,  f: p => p.multi++ },
  { id: 'pierce', ic: '🎯', n: 'Пробивание',        d: 'Пуля проходит ещё +1 врага', max: 4, f: p => p.pierce++ },
  { id: 'speed',  ic: '👟', n: 'Ускорители',        d: '+12% к скорости',          max: 5,  f: p => p.speed *= 1.12 },
  { id: 'hp',     ic: '❤️', n: 'Броня',             d: '+30 макс. HP и полное лечение',     f: p => { p.maxHp += 30; p.hp = p.maxHp; } },
  { id: 'regen',  ic: '🧬', n: 'Наниты',            d: '+1.5 HP в секунду',        max: 5,  f: p => p.regen += 1.5 },
  { id: 'magnet', ic: '🧲', n: 'Магнит',            d: '+50% радиус сбора',        max: 4,  f: p => p.magnet *= 1.5 },
  { id: 'orb',    ic: '🌀', n: 'Орбитальный клинок', d: '+1 клинок кружит вокруг тебя', max: 6, f: p => p.orbs++ },
  { id: 'boom',   ic: '💣', n: 'Взрывные пули',     d: 'Попадания бьют по площади', max: 4, f: p => p.boom++ },
  { id: 'crit',   ic: '✨', n: 'Крит',              d: '+12% шанс урона ×2.5',     max: 5,  f: p => p.crit += .12 },
  { id: 'dash',   ic: '💨', n: 'Форсаж',            d: '−25% перезарядка рывка',   max: 3,  f: p => p.dashMax *= .75 },
  { id: 'chain',  ic: '🌩️', n: 'Цепная молния',     d: 'Попадание бьёт током ещё +1 врага', max: 4, f: p => p.chain++ },
  { id: 'rocket', ic: '🚀', n: 'Ракеты',            d: 'Самонаводящиеся ракеты, чаще с уровнем', max: 4, f: p => p.rockets++ },
  { id: 'frost',  ic: '❄️', n: 'Крио-пули',         d: 'Попадания замедляют на +20%', max: 3, f: p => p.frost++ },
  { id: 'vamp',   ic: '🩸', n: 'Вампиризм',         d: '+0.5 HP за каждое убийство', max: 3, f: p => p.vamp++ }
];
const SHIPS = {
  assault: { n: 'Штурмовик', d: 'Баланс огня и брони',              col: '#3df2ff', f: p => {} },
  sniper:  { n: 'Снайпер',   d: 'Редкий мощный выстрел навылет',    col: '#c58bff', f: p => { p.rate = 1.7; p.dmg = 32; p.pierce = 2; p.bs = 1150; p.maxHp = 80; } },
  berserk: { n: 'Берсерк',   d: 'Дробовик в упор, быстрый, хрупкий', col: '#ffa53d', f: p => { p.multi = 3; p.dmg = 7; p.rate = 3.6; p.bl = .42; p.spread = .2; p.speed = 285; p.maxHp = 75; } }
};
const PERKS = [
  { id: 'hp',  n: 'Корпус',    d: '+10 HP за уровень' },
  { id: 'dmg', n: 'Орудия',    d: '+8% урона' },
  { id: 'spd', n: 'Двигатель', d: '+4% скорости' },
  { id: 'xp',  n: 'Сканер',    d: '+10% опыта' }
];
const PW = {
  bomb:   { ic: '💣', col: '#ff5a2d', n: 'БОМБА' },
  freeze: { ic: '❄️', col: '#7fd8ff', n: 'ЗАМОРОЗКА' },
  rage:   { ic: '🔥', col: '#ffa53d', n: 'ЯРОСТЬ' },
  vac:    { ic: '🧲', col: '#b46bff', n: 'ПЫЛЕСОС' }
};
const perkCost = l => 40 * (l + 1), PERK_MAX = 5;

/* ---------- сохранение ---------- */
const meta = { coins: 0, ship: 'assault', perks: { hp: 0, dmg: 0, spd: 0, xp: 0 } };
let best = 0, bestScore = 0;
try {
  best = +(localStorage.getItem('neonstorm_best') || 0);
  const m = JSON.parse(localStorage.getItem('neonstorm_meta') || 'null');
  if (m) { Object.assign(meta.perks, m.perks); meta.coins = m.coins | 0; bestScore = m.bestScore | 0; if (SHIPS[m.ship]) meta.ship = m.ship; }
} catch (e) {}
function save() { try { localStorage.setItem('neonstorm_meta', JSON.stringify(Object.assign({ bestScore }, meta))); localStorage.setItem('neonstorm_best', String(Math.floor(best))); } catch (e) {} }

/* ---------- состояние ---------- */
let state = 'menu', P, bullets, ebullets, enemies, gems, parts, texts, T, kills, spawnT, bossT, bossN, shake, flash, flashCol, eid,
    combo, comboT, maxCombo, score, freeze, cam = { x: 0, y: 0 };
const keys = {}, mouse = { x: 0, y: 0 };
let touchMode = false, stick = null;
const fmt = s => (s / 60 | 0) + ':' + String(s % 60 | 0).padStart(2, '0');
const mult = () => Math.min(5, 1 + Math.floor(combo / 10) * .5);

function reset() {
  const sh = SHIPS[meta.ship], pk = meta.perks;
  P = { x: 0, y: 0, vx: 0, vy: 0, r: 13, hp: 100, maxHp: 100, speed: 250, rate: 4, dmg: 10, multi: 1, pierce: 0, regen: 0, magnet: 95,
        bs: 760, bl: .95, spread: .13, col: sh.col, xpK: 1 + pk.xp * .1,
        orbs: 0, boom: 0, chain: 0, rockets: 0, frost: 0, vamp: 0, rocketT: 1, rage: 0, ult: 0,
        crit: .05, dashMax: 1.6, dashCd: 0, dashT: 0, dx: 1, dy: 0, inv: 0, fireT: 0, aim: 0, lvl: 1, xp: 0, need: 4, orbA: 0, ups: {} };
  sh.f(P);
  P.maxHp += pk.hp * 10; P.hp = P.maxHp; P.dmg *= 1 + pk.dmg * .08; P.speed *= 1 + pk.spd * .04;
  bullets = []; ebullets = []; enemies = []; gems = []; parts = []; texts = [];
  T = 0; kills = 0; spawnT = 0; bossT = 60; bossN = 0; shake = 0; flash = 0; flashCol = '255,70,110'; eid = 0;
  combo = 0; comboT = 0; maxCombo = 0; score = 0; freeze = 0;
}
reset();

function show(id) { for (const o of document.querySelectorAll('.ov')) o.classList.toggle('on', o.id === id); }
function start() { initAudio(); reset(); state = 'play'; show(null); }
function toMenu() { state = 'menu'; reset(); renderMenu(); show('menu'); }
function renderMenu() {
  const sb = $('ships'); sb.innerHTML = '';
  for (const id in SHIPS) {
    const s = SHIPS[id], d = document.createElement('div'); d.className = 'chip' + (meta.ship === id ? ' sel' : '');
    d.innerHTML = `<div class="ic" style="color:${s.col};text-shadow:0 0 12px ${s.col}">▲</div><div class="nm">${s.n}</div><div class="ds">${s.d}</div>`;
    d.onclick = () => { meta.ship = id; save(); renderMenu(); };
    sb.appendChild(d);
  }
  const sp = $('shop'); sp.innerHTML = '';
  for (const k of PERKS) {
    const l = meta.perks[k.id], c = perkCost(l), ok = l < PERK_MAX && meta.coins >= c, d = document.createElement('div');
    d.className = 'chip' + (ok ? '' : ' off');
    d.innerHTML = `<div class="nm">${k.n}</div><div class="ds">${k.d}</div><div class="lv">${'●'.repeat(l)}${'○'.repeat(PERK_MAX - l)} &nbsp; ${l < PERK_MAX ? '◈ ' + c : 'МАКС'}</div>`;
    d.onclick = () => { if (!ok) return; meta.coins -= c; meta.perks[k.id]++; save(); initAudio(); S.pw(); renderMenu(); };
    sp.appendChild(d);
  }
  $('coins').textContent = '◈ ' + meta.coins + ' кредитов — зарабатываются очками в бою';
  $('menuBest').textContent = best ? `Рекорд: ${fmt(best)} · ${bestScore} очков` : '';
}
function gameOver() {
  state = 'over'; S.over();
  const isBest = T > best, earned = Math.floor(score / 400);
  if (isBest) best = T;
  bestScore = Math.max(bestScore, Math.floor(score)); meta.coins += earned; save();
  $('stats').innerHTML = `Очки: <b>${Math.floor(score)}</b> &nbsp; Время: <b>${fmt(T)}</b><br>Убито: <b>${kills}</b> &nbsp; Уровень: <b>${P.lvl}</b> &nbsp; Макс. комбо: <b>${maxCombo}</b><br>` +
    `Заработано: <b>◈ ${earned}</b> (всего ${meta.coins})<br>` +
    (isBest ? '<span class="best">★ НОВЫЙ РЕКОРД ★</span>' : `Рекорд: <b>${fmt(best)}</b>`);
  setTimeout(() => { if (state === 'over') show('over'); }, 700);
}
function levelUp() {
  state = 'lvl'; S.lvl();
  const pool = UPS.filter(u => !u.max || (P.ups[u.id] || 0) < u.max), pick = [];
  while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.random() * pool.length | 0, 1)[0]);
  const box = $('cards'); box.innerHTML = '';
  pick.forEach((u, i) => {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `<span class="ky">${i + 1}</span><div class="ic">${u.ic}</div><div class="nm">${u.n}</div><div class="ds">${u.d}</div><div class="lv">ур. ${(P.ups[u.id] || 0)} → ${(P.ups[u.id] || 0) + 1}</div>`;
    d.onclick = () => choose(u);
    box.appendChild(d);
  });
  levelUp.pick = pick; show('lvl');
}
function choose(u) {
  if (state !== 'lvl' || !u) return;
  u.f(P); P.ups[u.id] = (P.ups[u.id] || 0) + 1;
  P.inv = Math.max(P.inv, .8); state = 'play'; show(null);
  ring(P.x, P.y, P.col, 40);
  for (const e of enemies) { const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < 200 && e.type !== 'boss') { e.kx = (e.x - P.x) / d * 500; e.ky = (e.y - P.y) / d * 500; } }
  if (P.xp >= P.need) gainXp(0);
}
function gainXp(v) {
  P.xp += v * P.xpK;
  if (P.xp >= P.need && state === 'play') { P.xp -= P.need; P.lvl++; P.need = Math.floor(3 + P.lvl * 3 + P.lvl * P.lvl * .5); levelUp(); }
}

/* ---------- эффекты ---------- */
function burst(x, y, col, n, sp = 220, life = .5) {
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(.2, 1) * sp; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(.4, 1) * life, m: life, col, s: rnd(1.5, 4) }); }
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}
function ring(x, y, col, r) { parts.push({ ring: 1, x, y, r: 4, R: r, l: .35, m: .35, col }); }
function txt(x, y, s, col, big) { texts.push({ x: x + rnd(-8, 8), y, s, col, l: big === 2 ? 1.4 : .7, big }); if (texts.length > 80) texts.shift(); }
function blast(x, y, R, dE, dP) {
  ring(x, y, '#ff8a3d', R); burst(x, y, '#ff8a3d', 16, 300, .45); shake = Math.max(shake, 6);
  for (const o of enemies) if (!o.dead && (o.x - x) ** 2 + (o.y - y) ** 2 < (R + o.r) ** 2) hurt(o, dE, false);
  if (dP && (P.x - x) ** 2 + (P.y - y) ** 2 < (R + P.r) ** 2) hitPlayer(dP);
}
function nearest(x, y, skip, maxD = 1e9) {
  let b = null, bd = maxD * maxD;

  }
  // пули
  for (const b of ebullets) { drawGlow(b.x, b.y, 16, b.col); g.fillStyle = '#fff'; g.beginPath(); g.arc(b.x, b.y, 4, 0, TAU); g.fill(); }
  g.strokeStyle = '#fff'; g.lineWidth = 3; g.lineCap = 'round';
  for (const b of bullets) {
    if (b.rk) { drawGlow(b.x, b.y, 22, '#ff8a3d'); g.fillStyle = '#fff'; g.beginPath(); g.arc(b.x, b.y, 4, 0, TAU); g.fill(); continue; }
    drawGlow(b.x, b.y, 14, P.col); g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - b.vx * .022, b.y - b.vy * .022); g.stroke();
  }

  // игрок
  if (state !== 'over' && state !== 'menu') {
    const pc = P.rage > 0 ? '#ffa53d' : P.col;
    for (let i = 0; i < P.orbs; i++) {
      const a = P.orbA + i * TAU / P.orbs, x = P.x + Math.cos(a) * 72, y = P.y + Math.sin(a) * 72;
      drawGlow(x, y, 26, '#ffd23d'); poly(x, y, 9, 3, a * 3); g.fillStyle = '#fff3c0'; g.fill();
    }
    const blink = P.inv > 0 && P.dashT <= 0 && (T * 20 | 0) % 2;
    drawGlow(P.x, P.y, P.rage > 0 ? 60 : 46, pc, blink ? .3 : 1);
    g.save(); g.translate(P.x, P.y); g.rotate(P.aim);
    g.beginPath(); g.moveTo(17, 0); g.lineTo(-11, 11); g.lineTo(-5, 0); g.lineTo(-11, -11); g.closePath();
    g.globalCompositeOperation = 'source-over'; g.fillStyle = '#06131c'; g.fill();
    g.globalCompositeOperation = 'lighter'; g.strokeStyle = blink ? 'rgba(255,255,255,.35)' : pc; g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
    g.restore();
    if (P.dashCd > 0) { g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.beginPath(); g.arc(P.x, P.y, 24, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - P.dashCd / P.dashMax)); g.stroke(); }
  }
  g.globalCompositeOperation = 'source-over';
  // бонусы
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const m of gems) {
    if (!m.pw) continue;
    const w = PW[m.pw], y = m.y + Math.sin(m.t * 4) * 3;
    if (m.t > 16 && (m.t * 6 | 0) % 2) continue;
    drawGlow(m.x, y, 34, w.col);
    g.fillStyle = 'rgba(8,10,24,.85)'; g.beginPath(); g.arc(m.x, y, 14, 0, TAU); g.fill();
    g.strokeStyle = w.col; g.lineWidth = 2; g.stroke();
    g.font = '15px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; g.fillStyle = '#fff'; g.fillText(w.ic, m.x, y + 1);
  }
  g.textBaseline = 'alphabetic';
  // цифры урона
  for (const t of texts) { g.globalAlpha = Math.min(1, t.l * 2.5); g.fillStyle = t.col; g.font = `800 ${t.big === 2 ? 26 : t.big ? 20 : 13}px "Segoe UI",Arial`; g.fillText(t.s, t.x, t.y); }
  g.globalAlpha = 1; g.restore();

  // виньетка
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,8,.7)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  if (flash > 0) { g.fillStyle = `rgba(${flashCol},${flash * .7})`; g.fillRect(0, 0, W, H); }
  if (state === 'menu') return;

  // HUD
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, 0, W, 7);
  g.fillStyle = '#3d9bff'; g.fillRect(0, 0, W * clamp(P.xp / P.need, 0, 1), 7);
  const bw = Math.min(240, W * .42);
  g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(16, 22, bw, 16);
  g.fillStyle = P.hp / P.maxHp < .3 ? '#ff3d7f' : '#3dffb0'; g.fillRect(16, 22, bw * P.hp / P.maxHp, 16);
  g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 1; g.strokeRect(16.5, 22.5, bw, 16);
  g.font = '700 12px monospace'; g.textAlign = 'left'; g.fillStyle = '#04121a'; g.fillText(Math.ceil(P.hp) + ' / ' + P.maxHp, 22, 34);
  g.fillStyle = '#cfe3ff'; g.font = '700 14px "Segoe UI",Arial'; g.fillText('УР. ' + P.lvl, 16, 58);
  let ey = 78;
  if (P.rage > 0) { g.fillStyle = '#ffa53d'; g.fillText('ЯРОСТЬ ' + P.rage.toFixed(1), 16, ey); ey += 18; }
  if (fz) { g.fillStyle = '#7fd8ff'; g.fillText('ЗАМОРОЗКА ' + freeze.toFixed(1), 16, ey); }
  g.textAlign = 'center'; g.font = '800 26px "Segoe UI",Arial'; g.fillStyle = '#fff'; g.fillText(fmt(T), W / 2, 44);
  if (combo >= 3) {
    const m = mult();
    g.font = '800 15px "Segoe UI",Arial'; g.fillStyle = m >= 3 ? '#ff3d9a' : m > 1 ? '#ffd23d' : '#9db4d6';
    g.fillText(`КОМБО ${combo}` + (m > 1 ? `  ×${m}` : ''), W / 2, 66);
    g.fillRect(W / 2 - 50, 72, 100 * clamp(comboT / 2.6, 0, 1), 3);
  }
  g.textAlign = 'right'; g.font = '800 18px "Segoe UI",Arial'; g.fillStyle = '#ffd23d'; g.fillText(Math.floor(score), W - 16, 38);
  g.font = '700 14px "Segoe UI",Arial'; g.fillStyle = '#cfe3ff'; g.fillText('☠ ' + kills, W - 16, 58);
  const boss = enemies.find(e => e.type === 'boss');
  if (boss) {
    const w = Math.min(520, W - 220), x = (W - w) / 2, y = H - 38;
    g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(x, y, w, 12);
    g.fillStyle = '#ff2d2d'; g.fillRect(x, y, w * boss.hp / boss.maxHp, 12);
    g.textAlign = 'center'; g.fillStyle = '#ff8080'; g.font = '800 13px "Segoe UI",Arial'; g.fillText('БОСС', W / 2, y - 6);
  }
  // ударная волна
  const ux = W - 60, uy = H - 60, full = P.ult >= 1;
  if (full) drawGlow(ux, uy, 60 + Math.sin(T * 6) * 6, P.col);
  g.fillStyle = 'rgba(8,10,24,.7)'; g.beginPath(); g.arc(ux, uy, 30, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.15)'; g.lineWidth = 5; g.stroke();
  g.strokeStyle = P.col; g.beginPath(); g.arc(ux, uy, 30, -Math.PI / 2, -Math.PI / 2 + TAU * P.ult); g.stroke();
  g.textAlign = 'center'; g.fillStyle = full ? '#fff' : 'rgba(255,255,255,.35)'; g.font = '800 20px "Segoe UI",Arial'; g.fillText(touchMode ? '✹' : 'Q', ux, uy + 7);
  if (stick) {
    g.strokeStyle = 'rgba(61,242,255,.4)'; g.lineWidth = 2; g.beginPath(); g.arc(stick.ox, stick.oy, 50, 0, TAU); g.stroke();
    g.fillStyle = 'rgba(61,242,255,.4)'; g.beginPath(); g.arc(stick.ox + stick.dx * 50, stick.oy + stick.dy * 50, 22, 0, TAU); g.fill();
  }
}

/* ---------- цикл ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  if (state === 'menu') { P.x += 40 * dt; P.y += 22 * dt; }
  if (state !== 'pause' && state !== 'lvl') updateFx(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- ввод ---------- */
function togglePause() { if (state === 'play') { state = 'pause'; show('pause'); } else if (state === 'pause') { state = 'play'; show(null); } }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ShiftLeft') dash();
  if (e.code === 'KeyQ' || e.code === 'KeyE') ult();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'lvl' && /^(Digit|Numpad)[1-3]$/.test(e.code)) choose(levelUp.pick[+e.code.slice(-1) - 1]);
  if (e.code === 'Enter' && (state === 'menu' || (state === 'over' && $('over').classList.contains('on')))) start();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
C.addEventListener('contextmenu', e => e.preventDefault());
C.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    touchMode = true;
    if (Math.hypot(e.clientX - (W - 60), e.clientY - (H - 60)) < 48) ult();
    else if (e.clientX < W / 2 && !stick) stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 }; else dash();
  } else { touchMode = false; mouse.x = e.clientX; mouse.y = e.clientY; if (e.button === 2) dash(); }
});
addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') {
    if (stick && e.pointerId === stick.id) { let dx = (e.clientX - stick.ox) / 50, dy = (e.clientY - stick.oy) / 50; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } stick.dx = dx; stick.dy = dy; }
  } else { mouse.x = e.clientX; mouse.y = e.clientY; }
});
const up = e => { if (stick && e.pointerId === stick.id) stick = null; };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
$('play').onclick = start; $('again').onclick = start; $('resume').onclick = togglePause;
$('hangar').onclick = toMenu; $('quit').onclick = toMenu;
if (matchMedia('(pointer:coarse)').matches) $('touchHint').style.display = 'block';
renderMenu();
</script>
